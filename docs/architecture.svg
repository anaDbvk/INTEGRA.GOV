<text x="1070" y="458" class="h" style="fill:#fff">Official Polish websites</text>
<text x="1070" y="479" class="sub" style="fill:#EAF1DF">searched live, never stored</text>
<text x="1070" y="518" class="s">gov.pl (incl. udsc, mos.cudzoziemcy, nfz, podatki, biznes) · zus.pl</text>
<text x="1070" y="537" class="s">migrant.info.pl · um.warszawa.pl (+ districts) · warszawa19115.pl</text>
<text x="1070" y="556" class="s">krakow.pl (+ districts)</text>
<text x="1070" y="575" class="s">List managed in Supabase table sources (assistant_enabled)</text>
