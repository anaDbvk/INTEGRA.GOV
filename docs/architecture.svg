<text x="74" y="1196" class="s">tests the live app on a phone</text>
<text x="74" y="1214" class="s">runs SQL in Supabase SQL Editor</text>
<text x="74" y="1232" class="s">sets secrets in Render / GitHub</text>
<rect x="430" y="1118" width="620" height="150" rx="12" fill="#F3E8FF"/>
<text x="444" y="1140" class="t b">GitHub Copilot CLI · coding agent</text>
<text x="444" y="1160" class="s">plans, edits code, writes tests and docs · follows .github/copilot-instructions.md</text>
<text x="444" y="1178" class="s">runs python -m unittest + Node smoke tests · headless Edge screenshots for UI checks</text>
<text x="444" y="1196" class="s">commits with Co-authored-by: Copilot trailer · git push · gh run watch (CI)</text>
<text x="444" y="1214" class="s">checks the live Render deploy (/health, headers) after each push</text>
<text x="444" y="1232" class="s">sub-agents: explore · code review · security review · rubber-duck</text>
