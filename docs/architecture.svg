<text x="730" y="872" class="s">raw_pages · documents · chunks</text>
<text x="730" y="891" class="s">    not used by the live assistant</text>
<text x="460" y="1000" class="s">Connection: Session pooler (IPv4) in DATABASE_URL · pooled psycopg2</text>
