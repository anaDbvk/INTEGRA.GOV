<text x="40" y="52" class="t" style="font-size:30px;font-weight:700">INTEGRA.GOV · Moving to Poland — technical architecture (with GitHub Copilot)</text>
<text x="40" y="80" class="s" style="font-size:15px;fill:#5F6685">Mobile-first web app · live official-source research with Claude · journeys in Supabase · CI-gated deploys from GitHub to Render</text>
<text x="40" y="104" class="band">RUNTIME</text>
<rect x="40" y="115" width="330" height="495" rx="20" fill="#fff" stroke="#E6E1D8" stroke-width="1.5"/>
<rect x="40" y="115" width="330" height="60" rx="20" fill="#2A5BD7"/>
<rect x="40" y="155" width="330" height="20" fill="#2A5BD7"/>
<text x="60" y="143" class="h" style="fill:#fff">Smartphone browser</text>
<text x="60" y="164" class="sub" style="fill:#E6EEFD">Mobile web app (SPA, also desktop)</text>
<text x="60" y="203" class="t b">Vanilla JS · HTML · CSS</text>
<text x="60" y="222" class="s">index.html · app.js · app.css · no framework</text>
<text x="60" y="252" class="t b">i18n.js — EN / PL / UK</text>
<text x="60" y="271" class="s">auto-detects phone language · switcher</text>
<text x="60" y="301" class="t b">History API</text>
<text x="60" y="320" class="s">phone Back button follows the app</text>
<text x="60" y="350" class="t b">Self-hosted fonts &amp; animations</text>
<text x="60" y="369" class="s">Lexend, Public Sans · scene.js</text>
<text x="60" y="399" class="t b">Screens</text>
<text x="60" y="418" class="s">Login · Home · Assistant chat · Creating</text>
<text x="60" y="437" class="s">My journeys · Journey · Step · Builder</text>
<text x="60" y="456" class="s">Explore · Alerts · Profile</text>
<text x="60" y="486" class="t b">Privacy (GDPR)</text>
<text x="60" y="505" class="s">Profile › Privacy: download / delete my data</text>
<text x="60" y="535" class="s">HttpOnly cookies · no keys or secrets in browser</text>
<rect x="440" y="115" width="540" height="495" rx="20" fill="#fff" stroke="#E6E1D8" stroke-width="1.5"/>
<rect x="440" y="115" width="540" height="60" rx="20" fill="#1B2A5C"/>
<rect x="440" y="155" width="540" height="20" fill="#1B2A5C"/>
<text x="460" y="143" class="h" style="fill:#fff">Render · Web service</text>
<text x="460" y="164" class="sub" style="fill:#E6EEFD">FastAPI · Python 3.12 · Uvicorn · deploys after CI passes</text>
<rect x="460" y="192" width="245" height="72" rx="12" fill="#E6EEFD"/>
<text x="474" y="214" class="t b">Static UI hosting</text>
<text x="474" y="234" class="s">GET / · /static/* · /health</text>
<text x="474" y="252" class="s">same origin, no CORS</text>
<rect x="715" y="192" width="245" height="72" rx="12" fill="#E6EEFD"/>
<text x="729" y="214" class="t b">Guest sessions</text>
<text x="729" y="234" class="s">phone → HMAC hash (no raw number)</text>
<text x="729" y="252" class="s">device + session cookies</text>
<rect x="460" y="274" width="245" height="72" rx="12" fill="#EAF1DF"/>
<text x="474" y="296" class="t b">Journeys API</text>
<text x="474" y="316" class="s">create own · edit steps · progress</text>
<text x="474" y="334" class="s">name, target date, focus</text>
<rect x="715" y="274" width="245" height="72" rx="12" fill="#FDEDE2"/>
<text x="729" y="296" class="t b">Alerts · chat · my data</text>
<text x="729" y="316" class="s">in-app reminders · saved chat</text>
<text x="729" y="334" class="s">GET /api/me/export · DELETE /api/me</text>
<rect x="460" y="356" width="500" height="110" rx="12" fill="#EFE7F8"/>
<text x="474" y="378" class="t b">Assistant · POST /api/interview</text>
<text x="474" y="398" class="s">1  Research: Claude + web search, only approved official domains</text>
<text x="474" y="416" class="s">2  Journey: forced tool return_journey_step → question or cited steps</text>
<text x="474" y="434" class="s">Guards: HTTPS + allowlisted sources only · every step cites S1…S8</text>
<text x="474" y="452" class="s">Domain allowlist from Supabase sources (5 min cache, env fallback)</text>
<rect x="460" y="476" width="500" height="72" rx="12" fill="#ECEEF3"/>
<text x="474" y="498" class="t b">Production guards</text>
<text x="474" y="518" class="s">CSP · HSTS · X-Frame-Options · no-store API · DB connection pool (keepalive)</text>
<text x="474" y="536" class="s">10 req/min per IP · 50 assistant messages/day per profile (assistant_usage)</text>
<text x="460" y="572" class="s">Secrets only in env vars: ANTHROPIC_API_KEY · DATABASE_URL ·</text>
<text x="460" y="590" class="s">APP_SESSION_SECRET · limits: ASSISTANT_DAILY_LIMIT · DB_POOL_MAX</text>
<rect x="1050" y="115" width="550" height="240" rx="20" fill="#fff" stroke="#E6E1D8" stroke-width="1.5"/>
<rect x="1050" y="115" width="550" height="60" rx="20" fill="#C25A14"/>
<rect x="1050" y="155" width="550" height="20" fill="#C25A14"/>
<text x="1070" y="143" class="h" style="fill:#fff">Anthropic API</text>
<text x="1070" y="164" class="sub" style="fill:#FDEDE2">Claude Haiku 4.5 (ANTHROPIC_MODEL / ANTHROPIC_FAST_MODEL)</text>
<text x="1070" y="203" class="t b">Call 1 · Research</text>
<text x="1070" y="222" class="s">server tool web_search_20250305 · max_uses 3 · allowed_domains · PL</text>
<text x="1070" y="241" class="s">answers only from cited search results · pause_turn continuation</text>
<text x="1070" y="271" class="t b">Call 2 · Journey</text>
<text x="1070" y="290" class="s">forced client tool return_journey_step (JSON schema)</text>
<text x="1070" y="309" class="s">outcome: interview | journey | unsupported · reply in EN / PL / UK</text>
<text x="1070" y="339" class="s">Billing: tokens + $10 per 1,000 searches · Console spend limit</text>
<rect x="1050" y="430" width="550" height="180" rx="20" fill="#fff" stroke="#E6E1D8" stroke-width="1.5"/>
