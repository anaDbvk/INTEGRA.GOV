<text x="460" y="721" class="h" style="fill:#0B3B24">Supabase · PostgreSQL</text>
<text x="460" y="742" class="sub" style="fill:#0B3B24">Row-level security on · accessed only by the server</text>
<text x="460" y="785" class="t b">App data (supabase/app_tables.sql)</text>
<text x="460" y="804" class="s">guest_profiles · guest_devices</text>
<text x="460" y="823" class="s">guest_sessions · guest_conversations</text>
