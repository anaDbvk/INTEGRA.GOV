name: Scrape Polish government and city pages

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages per source"
        default: "100"
      sources_only:
        description: "Comma-separated source names (empty = all)"
        default: "gov.pl,mos,udsc,biznes,podatki,zus,nfz,migrant,krakow,warsaw,warsaw19115,krakow_district_01,krakow_district_02,krakow_district_03,krakow_district_04,krakow_district_05,krakow_district_06,krakow_district_07,krakow_district_08,krakow_district_09,krakow_district_10,krakow_district_11,krakow_district_12,krakow_district_13,krakow_district_14,krakow_district_15,krakow_district_16,krakow_district_17,krakow_district_18,warsaw_bemowo,warsaw_bialoleka,warsaw_bielany,warsaw_mokotow,warsaw_ochota,warsaw_praga_poludnie,warsaw_praga_polnoc,warsaw_rembertow,warsaw_srodmiescie,warsaw_targowek,warsaw_ursus,warsaw_ursynow,warsaw_wawer,warsaw_wesola,warsaw_wilanow,warsaw_wlochy,warsaw_wola,warsaw_zoliborz"
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scrape
        env:
          MAX_PAGES: ${{ inputs.max_pages || '100' }}
          SOURCES_ONLY: ${{ inputs.sources_only || '' }}
        run: python pl_gov_scraper.py

      - name: Save output
        uses: actions/upload-artifact@v4
        with:
          name: pl_gov_pages
          path: pl_gov_pages.jsonl
          retention-days: 90
          if-no-files-found: warn
