services:
  - type: web
    name: moving-to-poland
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_FAST_MODEL
        sync: false
      - key: WEB_SEARCH_DOMAINS
        value: gov.pl,migrant.info.pl,udsc.gov.pl,nfz.gov.pl,zus.pl,podatki.gov.pl,biznes.gov.pl
      - key: WEB_SEARCH_MAX_USES
        value: 3
      - key: ADMIN_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
      - key: ASSISTANT_DAILY_LIMIT
        value: 50
      - key: DB_POOL_MAX
        value: 5
